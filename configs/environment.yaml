name: wswm-repro
channels: [conda-forge]
dependencies:
  - python=3.11
  - numpy>=1.24
  - pandas>=2.0
  - pyarrow>=12.0
  - scipy>=1.10
  - matplotlib>=3.7
  - pip
# The package as released runs on the above alone: every table and figure is
# rebuilt from the records in data/.
#
# Re-running the experiments themselves, rather than the analysis, additionally
# needs the model stack pinned in configs/:
#   - sentence-transformers   (all-MiniLM-L6-v2, ms-marco-MiniLM-L-6-v2)
#   - bm25s                   (k1=0.9, b=0.4, Snowball English)
#   - transformers, torch     (distilbert-base-uncased, deberta-v3-base-prompt-injection-v2,
#                              gpt2, Qwen2.5-1.5B-Instruct, Qwen2.5-3B-Instruct)
#   - pytrec_eval             (nDCG@10)
#   - scikit-learn            (the logistic and forest models)
#   - datasets                (BEIR collections, SQuAD, the pooled injection corpora)
