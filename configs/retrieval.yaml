# Section 4: full-corpus retrieval under matched reranking budgets.
seed: 42

collections:            # BEIR, loaded at the pinned version; no dataset-provided candidate pools
  - {name: nfcorpus,   n_docs: 3633,   n_queries: 323}
  - {name: scifact,    n_docs: 5183,   n_queries: 300}
  - {name: arguana,    n_docs: 8674,   n_queries: 1406}
  - {name: scidocs,    n_docs: 25657,  n_queries: 1000}
  - {name: fiqa,       n_docs: 57638,  n_queries: 648}
  - {name: trec-covid, n_docs: 171332, n_queries: 50}

dense:
  model: sentence-transformers/all-MiniLM-L6-v2
  dim: 384
  normalise: l2
  similarity: inner_product     # exact, chunked matrix multiplication - no ANN index, so no ANN parameters
  max_seq_length: 256

lexical:
  implementation: bm25s
  k1: 0.9
  b: 0.4
  stemmer: snowball-english
  stopwords: english

fusion:
  candidate_depth_m: 1000
  normalisation: min-max within each retrieved list
  missing_channel_score: 0.0    # a document retrieved by one channel only receives 0 from the other
  constant_list_rule: all normalised values set to 0
  score: alpha * s_dense + (1 - alpha) * s_lexical
  policies:
    rrf: {k: 60}
    fixed_alpha: 0.8            # fit on MS MARCO, applied unchanged to every collection
    learned_alpha:
      model: RandomForest
      n_estimators: 50
      max_depth: 5
      features: [query_len, dense_std, bm25_std, dense_cv, bm25_cv, has_identifier]
      fit_on: 3000 MS MARCO training queries against a 200,000-passage corpus
    override_rule:              # deterministic guard applied on top of the learned weight
      return_alpha_1_if: dense_max_score > 0.85 or bm25_coefficient_of_variation < 0.1
    oracle_alpha:
      grid: [0.00, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50,
             0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00]
      note: hindsight bound within this scalar convex family, not a system

rerank:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  budgets: [0, 50, 100]

evaluation:
  metric: nDCG@10
  implementation: pytrec_eval
  intervals:
    method: paired bootstrap over per-query scores
    resamples: 10000
    level: 0.95
